name: Mypy check

on:
  pull_request:
  push:
    branches: master


jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install Tox
        run: pip install tox
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      - name: Run Tox
        id: mypy-run
        run: tox -e mypy
        continue-on-error: true
      - name: Report if mypy has gone wrong.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '*Warning*: The **mypy** type checker has found some errors. See the mypy job for details'
            })
        if: steps.mypy-run.outcome == 'failure'
